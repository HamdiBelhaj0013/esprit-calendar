# The weekly download runs on your PC (ESPRIT's firewall blocks GitHub's servers).
# This workflow is the fallback: upload a PDF into inbox/ (GitHub website or app → Add file → Upload)
# and it syncs Google Calendar + emails you, without touching the ESPRIT portal.
name: ESPRIT timetable → Google Calendar (inbox upload)

on:
  push:
    paths: ["inbox/*.pdf"]

concurrency: edt-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Sync
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          PDFS=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'inbox/*.pdf')
          [ -n "$PDFS" ] || { echo "No new PDF in inbox/"; exit 0; }
          python main.py --pdf $PDFS

      - name: Keep PDF and .ics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edt-${{ github.run_number }}
          path: |
            out/*.pdf
            out/*.ics
          if-no-files-found: ignore
          retention-days: 30
